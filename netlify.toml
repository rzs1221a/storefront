# On this branch, the deployable site is ferrycre.com (ferrycre/).
# Pointing base there means a Netlify site aimed at this branch needs zero
# UI configuration — Netlify builds inside ferrycre/ and uses the
# netlify.toml that lives there (build command, publish dir, functions,
# redirects, headers).
#
# The storefront's own config lives on main; this file intentionally
# diverges here.

[build]
  base = "ferrycre"
