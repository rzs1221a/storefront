<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />

    <title>Seamark Studio — Get found. Get the lead. Own the whole route.</title>
    <!-- The counts here are a static approximation of the derived ones in
         src/lib — the prerender retags every route with the real figures. -->
    <meta
      name="description"
      content="The whole route a client travels — the search, the light that catches them, the page they land on, the record that reaches your CRM. Built once, owned outright, no monthly platform fee."
    />
    <link rel="canonical" href="https://seamark.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seamark.studio/" />
    <meta
      property="og:title"
      content="Seamark Studio — Get found. Get the lead. Own the whole route."
    />
    <meta
      property="og:description"
      content="The whole route a client travels, built once and owned outright. No monthly platform fee."
    />
    <meta property="og:image" content="https://seamark.studio/og.webp" />
    <meta property="og:site_name" content="Seamark Studio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Seamark Studio — Get found. Get the lead. Own the whole route."
    />
    <meta
      name="twitter:description"
      content="Built once, owned outright, no monthly platform fee."
    />
    <meta name="twitter:image" content="https://seamark.studio/og.webp" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- There is deliberately no image preload here any more.
         The home page used to open on a full-bleed screenshot of The Aerial,
         which was the largest contentful paint and worth preloading per
         breakpoint. It now opens on the Passage: an inline SVG that ships
         inside the document and paints without a single extra request. The
         screenshots moved below the fold into the proof strip, where they are
         lazily loaded — preloading one of them now would fetch a megabyte
         nobody has scrolled to yet, on the page whose speed is the pitch. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Seamark Studio",
        "description": "Custom website design and development for real estate agents and brokerages.",
        "url": "https://seamark.studio/",
        "areaServed": "United States",
        "serviceType": "Website design and development",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Amelia Island",
          "addressRegion": "FL",
          "addressCountry": "US"
        }
      }
    </script>
  </head>
  <body>
    <!-- Liquid-glass refraction map, ported from heymann-williams-coastal.
         backdrop-filter: url(#liquid-glass-filter) would bend the backdrop
         through this turbulence field for a light-warping edge; the shipped
         recipe uses the blur/saturate stack in index.css instead (Safari
         ignores url() in backdrop-filter), but the lens ships with the page
         for the surfaces that opt in. -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
      <defs>
        <filter id="liquid-glass-filter" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="2" seed="17" result="warp" />
          <feGaussianBlur in="warp" stdDeviation="2.6" result="warpSoft" />
          <feDisplacementMap in="SourceGraphic" in2="warpSoft" scale="30" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
