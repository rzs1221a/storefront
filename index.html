<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />

    <title>Seamark Studio — Custom websites for real estate agents</title>
    <!-- The counts here are a static approximation of the derived ones in
         src/lib — the prerender retags every route with the real figures. -->
    <meta
      name="description"
      content="Custom websites for real estate professionals — 24 site types, from agent pages to full 3D market platforms, five shipped along this coast as proof. Built once, owned outright, no monthly platform fee."
    />
    <link rel="canonical" href="https://seamark.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://seamark.studio/" />
    <meta
      property="og:title"
      content="Seamark Studio — Custom websites for real estate agents"
    />
    <meta
      property="og:description"
      content="Your website should be the reason they call you. Built once, owned outright, no monthly platform fee."
    />
    <meta property="og:image" content="https://seamark.studio/og.webp" />
    <meta property="og:site_name" content="Seamark Studio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Seamark Studio — Custom websites for real estate agents"
    />
    <meta
      name="twitter:description"
      content="Built once, owned outright, no monthly platform fee."
    />
    <meta name="twitter:image" content="https://seamark.studio/og.webp" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The largest above-the-fold image, and therefore the largest
         contentful paint. Preloaded per breakpoint so a phone fetches the
         phone capture and never pays for the desktop one. Must stay in sync
         with the featured <picture> in src/routes/Coast.tsx. -->
    <link
      rel="preload"
      as="image"
      href="/work/the-aerial/desktop.webp"
      type="image/webp"
      media="(min-width: 641px)"
    />
    <link
      rel="preload"
      as="image"
      href="/work/the-aerial/mobile.webp"
      type="image/webp"
      media="(max-width: 640px)"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Seamark Studio",
        "description": "Custom website design and development for real estate agents and brokerages.",
        "url": "https://seamark.studio/",
        "areaServed": "United States",
        "serviceType": "Website design and development",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Amelia Island",
          "addressRegion": "FL",
          "addressCountry": "US"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
